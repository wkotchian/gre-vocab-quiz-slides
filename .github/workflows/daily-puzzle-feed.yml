name: Daily GRE word puzzle feed

# Rebuilds docs/puzzle/feed.xml (served by GitHub Pages) for Mailchimp's daily puzzle email.
# Runs the evening before: 04:07 UTC = 9:07 pm Pacific (daylight time) or 8:07 pm (standard time).
# Scheduled runs build the Pacific date six hours from now, so a run between 6 pm and midnight Pacific
# builds tomorrow's puzzle and a run delayed past midnight still builds today's. GitHub has started
# scheduled runs 4-6 hours late; this leaves about 10 hours before the 6 am Pacific email.
on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Build for this date, YYYY-MM-DD (blank = today, Pacific)"
        default: ""

permissions:
  contents: write   # to commit the feed and teaser images

concurrency:
  group: daily-puzzle-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install -q pillow

      - name: Build the feed
        env:
          D: ${{ github.event.inputs.date }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$D" ] && [ "$EVENT" = "schedule" ]; then D=$(TZ=America/Los_Angeles date -d '+6 hours' +%F); fi
          if [ -n "$D" ]; then python3 puzzle_feed.py --date "$D"; else python3 puzzle_feed.py; fi | tee run.txt

      - name: Commit the feed
        run: |
          git config user.name "gre-quiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/puzzle
          git commit -q -m "puzzle feed: $(head -1 run.txt)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          echo "could not push the feed" && exit 1
