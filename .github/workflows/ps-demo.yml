name: Presenter demo cut

# Builds short demo cuts (avatar bursts + slides) from HeyGen clips listed in demos.json on the demo-tmp branch,
# then commits the MP4s back to that branch so they can be reviewed. The branch is temporary.
on:
  push:
    branches: [demo-tmp]
    paths: ["demos.json"]

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        timeout-minutes: 6
        run: |
          pip install -q pillow imageio-ffmpeg
          if ! command -v ffmpeg >/dev/null 2>&1; then
            FF="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            sudo ln -sf "$FF" /usr/local/bin/ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1
      - name: Cut demos
        run: |
          mkdir -p demos
          python3 - <<'EOF'
          import json, subprocess
          for d in json.load(open("demos.json")):
              clip = f"/tmp/{d['name']}.mp4"
              subprocess.run(["curl", "-sSL", "-o", clip, d["url"]], check=True)
              subprocess.run(["python3", "make_demo.py", d["name"], clip, f"demos/demo-{d['name']}.mp4"], check=True)
          EOF
          ls -la demos
      - name: Commit demos
        run: |
          git config user.name "gre-quiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add demos/*.mp4
          git commit -q -m "demo cuts" && git push -q origin HEAD:demo-tmp
