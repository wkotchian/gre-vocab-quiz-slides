name: Daily GRE Quant Short

# Uploads ONE GRE Quant Short per day (questions from GRE Math Knight 2.0) to the
# "Vince Kotchian Test Prep" YouTube channel via the official API.
# Does nothing until math/start_date.txt holds a date (set the day 2.0 is live on the App Store).
# 02:23 UTC = 6:23 pm Pacific in standard time (7:23 pm in daylight time), away from the vocab Short (19:41 UTC).
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      privacy:
        description: "public, private, or unlisted"
        default: "private"
      num:
        description: "Question number to upload (blank = next in order; a number skips the start-date check)"
        default: ""
      render_only:
        description: "true = render one video as a test and upload nothing"
        default: "false"

permissions:
  contents: write   # only to append to math_shorts.log

concurrency:
  group: daily-math-short
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        timeout-minutes: 6
        run: |
          pip install -q pillow matplotlib imageio-ffmpeg
          if ! command -v ffmpeg >/dev/null 2>&1; then
            FF="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            sudo ln -sf "$FF" /usr/local/bin/ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1

      - name: Render-only test (uploads nothing)
        if: github.event.inputs.render_only == 'true'
        run: |
          python3 make_math_short.py ${{ github.event.inputs.num || '61' }} test.mp4
          ls -la test.mp4

      - name: Render and upload next GRE Quant Short (one max; skips if uploaded < 16h ago)
        if: github.event.inputs.render_only != 'true'
        id: up
        timeout-minutes: 12
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
          NUM: ${{ github.event.inputs.num }}
        run: |
          set -o pipefail
          args="--privacy $PRIVACY"
          if [ -n "$NUM" ]; then args="$args --num $NUM"; fi
          python3 upload_math_short.py $args | tee run.txt

      - name: Log the run
        if: always() && steps.up.outcome == 'success'
        run: |
          line="$(date -u +%Y-%m-%dT%H:%MZ) $(grep -E '^(UPLOADED|SKIP|QUEUE EMPTY|NOT STARTED)' run.txt | head -1)"
          case "$line" in *"NOT STARTED"*) echo "$line"; exit 0;; esac
          echo "$line" >> math_shorts.log
          git config user.name "gre-quiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add math_shorts.log
          git commit -q -m "log: $line" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          echo "could not push log (harmless)"
