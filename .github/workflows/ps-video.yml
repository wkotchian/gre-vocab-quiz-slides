name: Personal statement examples video

# Renders ps_videos/<slug>.json into an annotated examples video (Kokoro narration) and uploads it.
# Manual only. Default privacy is unlisted so Vince can review before it goes public.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "ps_videos/<slug>.json"
        default: "dpt"
      privacy:
        description: "unlisted, private, or public"
        default: "unlisted"
      again:
        description: "yes = upload even if this slug was uploaded before"
        default: "no"

permissions:
  contents: write   # to append to ps_videos.log

concurrency:
  group: ps-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        timeout-minutes: 12
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile pillow imageio-ffmpeg
          if ! command -v ffmpeg >/dev/null 2>&1; then
            FF="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            sudo ln -sf "$FF" /usr/local/bin/ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1

      - name: Render
        timeout-minutes: 15
        run: python3 make_ps_video.py "${{ github.event.inputs.slug }}"

      - name: Keep the render as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps-video-${{ github.event.inputs.slug }}
          path: |
            out/${{ github.event.inputs.slug }}.mp4
            out/${{ github.event.inputs.slug }}-thumb.jpg
            out/${{ github.event.inputs.slug }}-chapters.json
          retention-days: 30

      - name: Upload to YouTube
        id: up
        timeout-minutes: 10
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          extra=""; if [ "${{ github.event.inputs.again }}" = "yes" ]; then extra="--again"; fi
          python3 upload_ps_video.py "${{ github.event.inputs.slug }}" --privacy "${{ github.event.inputs.privacy }}" $extra | tee run.txt

      - name: Log the upload
        if: always() && steps.up.outcome == 'success'
        run: |
          line="$(date -u +%Y-%m-%dT%H:%MZ) ${{ github.event.inputs.slug }} $(grep -E '^UPLOADED' run.txt | head -1) $(grep -E '^THUMBNAIL' run.txt | head -1)"
          echo "$line" >> ps_videos.log
          git config user.name "gre-quiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ps_videos.log
          git commit -q -m "log: $line" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          echo "could not push log (harmless)"
