name: Personal statement examples video

# Renders ps_videos/<slug>.json into an annotated examples video (Kokoro narration) and uploads it.
# Runs by hand, or when ps_videos/run.json changes (keys: slug, privacy, again), so Claude can start it with a push.
# Default privacy is unlisted; review copies go up as private.
on:
  push:
    branches: [main]
    paths: ["ps_videos/run.json"]
  workflow_dispatch:
    inputs:
      slug:
        description: "ps_videos/<slug>.json"
        default: "dpt"
      privacy:
        description: "unlisted, private, or public"
        default: "unlisted"
      again:
        description: "yes = upload even if this slug was uploaded before"
        default: "no"

permissions:
  contents: write   # to append to ps_videos.log

concurrency:
  group: ps-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick slug and privacy (inputs on a manual run, ps_videos/run.json on a push)
        env:
          IN_SLUG: ${{ github.event.inputs.slug }}
          IN_PRIVACY: ${{ github.event.inputs.privacy }}
          IN_AGAIN: ${{ github.event.inputs.again }}
        run: |
          python3 - >> "$GITHUB_ENV" <<'EOF'
          import json, os
          d = {} if os.environ.get("IN_SLUG") else json.load(open("ps_videos/run.json"))
          print("SLUG=" + (os.environ.get("IN_SLUG") or d["slug"]))
          print("PRIVACY=" + (os.environ.get("IN_PRIVACY") or d.get("privacy", "unlisted")))
          print("AGAIN=" + (os.environ.get("IN_AGAIN") or d.get("again", "no")))
          EOF
          cat "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        timeout-minutes: 12
        run: |
          # kokoro-onnx: same Kokoro-82M voice, no torch or spaCy (the spaCy path crashed on load, 2026-10-25)
          pip install -q kokoro-onnx soundfile pillow imageio-ffmpeg
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSL -o kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          curl -sSL -o voices-v1.0.bin "$base/voices-v1.0.bin"
          ls -la kokoro-v1.0.onnx voices-v1.0.bin
          python -c "from kokoro_onnx import Kokoro; k=Kokoro('kokoro-v1.0.onnx','voices-v1.0.bin'); a,sr=k.create('Test.', voice='af_heart', lang='en-us'); print('tts ok', sr, len(a))"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            FF="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            sudo ln -sf "$FF" /usr/local/bin/ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1

      - name: Render
        timeout-minutes: 15
        run: python make_ps_video.py "${{ env.SLUG }}"

      - name: Keep the render as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps-video-${{ env.SLUG }}
          path: |
            out/${{ env.SLUG }}.mp4
            out/${{ env.SLUG }}-thumb.jpg
            out/${{ env.SLUG }}-chapters.json
          retention-days: 30

      - name: Upload to YouTube
        id: up
        timeout-minutes: 10
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          extra=""; if [ "${{ env.AGAIN }}" = "yes" ]; then extra="--again"; fi
          python upload_ps_video.py "${{ env.SLUG }}" --privacy "${{ env.PRIVACY }}" $extra | tee run.txt

      - name: Log the upload
        if: always() && steps.up.outcome == 'success'
        run: |
          line="$(date -u +%Y-%m-%dT%H:%MZ) ${{ env.SLUG }} $(grep -E '^UPLOADED' run.txt | head -1) $(grep -E '^THUMBNAIL' run.txt | head -1)"
          echo "$line" >> ps_videos.log
          git config user.name "gre-quiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ps_videos.log
          git commit -q -m "log: $line" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          echo "could not push log (harmless)"
