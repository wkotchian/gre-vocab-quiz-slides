name: Daily GRE vocab Short

# Uploads ONE quiz Short per day to the "Vince Kotchian Test Prep" YouTube channel via the official API.
# 19:41 UTC = 12:41 pm Pacific during daylight time (11:41 am after clocks fall back).
# 2026-10-19: re-saved so GitHub registers the schedule (no scheduled run had fired yet).
on:
  schedule:
    - cron: "41 19 * * *"
  workflow_dispatch:
    inputs:
      privacy:
        description: "public, private, or unlisted"
        default: "private"
      num:
        description: "Quiz number to upload (blank = next in order)"
        default: ""

permissions:
  contents: write   # only to append to shorts.log

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow

      - name: Render and upload next Short (one max; skips if uploaded < 16h ago)
        id: up
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
          NUM: ${{ github.event.inputs.num }}
        run: |
          set -o pipefail
          args="--privacy $PRIVACY"
          if [ -n "$NUM" ]; then args="$args --num $NUM"; fi
          python3 upload_short.py $args | tee run.txt

      - name: Log the run
        if: always() && steps.up.outcome == 'success'
        run: |
          line="$(date -u +%Y-%m-%dT%H:%MZ) $(grep -E '^(UPLOADED|SKIP|QUEUE EMPTY)' run.txt | head -1)"
          echo "$line" >> shorts.log
          # 2026-10-20: also keep the playlist result, since run logs can't be read from outside GitHub
          pl="$(grep -E '^PLAYLIST' run.txt | head -1 | cut -c1-300)"
          if [ -n "$pl" ]; then echo "$(date -u +%Y-%m-%dT%H:%MZ) $pl" >> shorts.log; fi
          git config user.name "gre-quiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add shorts.log
          git commit -q -m "log: $line" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          echo "could not push log (harmless)"
