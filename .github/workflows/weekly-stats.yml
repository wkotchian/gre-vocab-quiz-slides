name: Weekly quiz stats

# Read-only snapshot of how the quiz posts are doing: Instagram (carousels and Reels) and the
# YouTube Shorts. Never posts, edits or deletes anything. Writes stats/ and commits it.
# 14:17 UTC Sunday = 7:17 am Pacific in daylight time (6:17 am after clocks fall back).
# A Claude scheduled task reads stats/ on Monday mornings and reports to Vince.
on:
  schedule:
    - cron: "17 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write   # only to commit stats/

concurrency:
  group: weekly-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Load live Instagram token (ig_token.enc if present, else the IG_TOKEN secret)
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 -I ig_token.py export

      - name: Pull stats (read-only)
        id: stats
        timeout-minutes: 10
        env:
          IG_TOKEN: ${{ env.IG_LIVE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python3 -I stats.py | tee run.txt

      - name: Commit stats
        if: always() && steps.stats.outcome == 'success'
        run: |
          line="$(grep -E '^STATS' run.txt | head -1 | cut -c1-200)"
          git config user.name "gre-quiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats
          git commit -q -m "stats: $line" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          echo "::error::could not push stats"
          exit 1
